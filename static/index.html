<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giám sát An toàn Lao động</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="/css/style.css">
<script>
/* Fallback an toàn cho logo trước khi UI module load */
function logoFallback(img, name) {
  img.onerror = null;
  img.style.display = "none";
  const span = document.createElement("span");
  span.className = "logo-fallback";
  span.textContent = name.replace(".png", "").replace(/-/g, " ").toUpperCase();
  img.parentNode.appendChild(span);
}
</script>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="logos">
      <img src="/assets/logos/logo-dai-hoc-xay-dung.jpg" alt="Đại học Xây dựng"
           onerror="logoFallback(this,'logo-dai-hoc-xay-dung.png')">
      <img src="/assets/logos/logo-khoa-co-khi.jpg" alt="Khoa Cơ khí"
           onerror="logoFallback(this,'logo-khoa-co-khi.jpg')">
    </div>
    <div class="brand-text">
      <div class="brand-title" data-i18n="brand.title">NGHIÊN CỨU KHOA HỌC SINH VIÊN 2026</div>
      <div class="brand-sub" data-i18n="brand.subtitle">GIÁM SÁT AN TOÀN LAO ĐỘNG</div>
    </div>
  </div>
  <div class="header-right">
    <span class="status-pill" id="header-status">
      <span class="dot"></span><span data-i18n="status.offline">Offline</span>
    </span>
  </div>
</header>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar">
      <i data-lucide="menu"></i>
    </button>
    <nav class="nav">
      <a href="#/dashboard"  class="nav-item" data-route="dashboard">
        <i data-lucide="layout-dashboard"></i><span data-i18n="nav.dashboard">Tổng quan</span></a>
      <a href="#/monitoring" class="nav-item" data-route="monitoring">
        <i data-lucide="video"></i><span data-i18n="nav.monitoring">Giám sát trực tiếp</span></a>
      <a href="#/violations" class="nav-item" data-route="violations">
        <i data-lucide="alert-triangle"></i><span data-i18n="nav.violations">Cảnh báo vi phạm</span></a>
      <a href="#/employees"  class="nav-item" data-route="employees">
        <i data-lucide="users"></i><span data-i18n="nav.employees">Quản lý công nhân</span></a>
      <a href="#/enrollment" class="nav-item" data-route="enrollment">
        <i data-lucide="user-plus"></i><span data-i18n="nav.enrollment">Đăng ký khuôn mặt</span></a>
      <a href="#/history"    class="nav-item" data-route="history">
        <i data-lucide="history"></i><span data-i18n="nav.history">Lịch sử vi phạm</span></a>
      <a href="#/analytics"  class="nav-item" data-route="analytics">
        <i data-lucide="bar-chart-3"></i><span data-i18n="nav.analytics">Thống kê báo cáo</span></a>
      <a href="#/settings"   class="nav-item" data-route="settings">
        <i data-lucide="settings"></i><span data-i18n="nav.settings">Cài đặt hệ thống</span></a>
    </nav>
    <div class="sidebar-foot">
      <div class="lang-mini">
        <button class="lang-opt" data-lang="vi">VI</button>
        <button class="lang-opt" data-lang="en">EN</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1 id="page-title">Tổng quan</h1>
      <div id="page-actions"></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div id="toast-container" class="toast-container"></div>
<div id="modal-root"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
